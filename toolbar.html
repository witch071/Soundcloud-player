<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  html,body{margin:0;height:100%;background:#1a1a1a;color:#ddd;font:12px 'Segoe UI',sans-serif;overflow:hidden;user-select:none}
  #bar{display:flex;align-items:center;gap:4px;height:40px;padding:0 8px;box-sizing:border-box}
  button{background:none;border:0;color:#ddd;min-width:34px;height:30px;border-radius:6px;cursor:pointer;
         display:flex;align-items:center;justify-content:center;gap:6px;font:inherit}
  button:hover:not(:disabled){background:#2e2e2e}
  button:disabled{opacity:.3;cursor:default}
  .sp{flex:1}
  .pill{padding:0 10px}
  .dot{width:8px;height:8px;border-radius:50%;background:#666}
  .on .dot{background:#6ee787}
  svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style></head><body>
<div id="bar">
  <button id="back" title="Назад (Alt+←)" disabled><svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
  <button id="fwd" title="Вперёд (Alt+→)" disabled><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
  <button id="rel" title="Обновить (F5)"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/></svg></button>
  <div class="sp"></div>
  <button id="ad" class="pill" title="Блокировщик рекламы"><span class="dot"></span>Блок рекламы</button>
  <button id="vpn" class="pill" title="VPN / Прокси (Ctrl+,)"><span class="dot"></span>VPN</button>
</div>
<script>
  const $ = id => document.getElementById(id);
  $('back').onclick = () => nav.back();
  $('fwd').onclick = () => nav.forward();
  $('rel').onclick = () => nav.reload();
  $('ad').onclick = () => nav.adblock();
  $('vpn').onclick = () => nav.vpn();
  nav.onState(s => {
    $('back').disabled = !s.back;
    $('fwd').disabled = !s.forward;
    $('ad').classList.toggle('on', !!s.adblock);
    $('vpn').classList.toggle('on', !!s.vpn);
  });
</script></body></html>
